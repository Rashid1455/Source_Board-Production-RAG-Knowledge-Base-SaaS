name: sourceboard
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql://sourceboard:${POSTGRES_PASSWORD:-sourceboard}@postgres:5432/sourceboard
    S3_ENDPOINT: http://minio:9000
  restart: unless-stopped
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sourceboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourceboard}
      POSTGRES_DB: sourceboard
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourceboard -d sourceboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sourceboard}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sourceboard-local-only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["objects:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: python -m app.migrate
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 10s
      retries: 5
  worker:
    <<: *backend
    command: python -m app.worker
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  objects:
