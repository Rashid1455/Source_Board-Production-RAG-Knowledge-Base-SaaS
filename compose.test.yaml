# Standalone disposable infrastructure for integration tests, separate from app data.
name: sourceboard-tests
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: sourceboard_test
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d sourceboard_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: sourceboard
      MINIO_ROOT_PASSWORD: sourceboard-local-only
    tmpfs: /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql://test:test@postgres:5432/sourceboard_test
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./backend/tests:/app/tests:ro
      - ./backend/pytest.ini:/app/pytest.ini:ro
    command: python -m pytest -v -p no:cacheprovider
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
